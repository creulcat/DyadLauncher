name: Dyad Launcher release
on:
  workflow_run:
    workflows: ['Dyad Launcher build']
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/prod' }}

jobs:
  release:
    name: Release Dyad Launcher
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    env:
      VERSION_TAG: ${{ github.event.workflow_run.head_branch }}
      LINUX_X64_BUNDLE_ARTIFACT_NAME: App bundle (x86_64-unknown-linux-gnu)
      WINDOWS_X64_BUNDLE_ARTIFACT_NAME: App bundle (x86_64-pc-windows-msvc)
      MACOS_UNIVERSAL_BUNDLE_ARTIFACT_NAME: App bundle (universal-apple-darwin)

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify ref is a tag
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tag_sha=$(gh api "repos/${{ github.repository }}/git/refs/tags/${VERSION_TAG}" --jq '.object.sha' 2>/dev/null || true)
          if [ -z "$tag_sha" ]; then
            echo "::error::${VERSION_TAG} is not a git tag in this repo"
            exit 1
          fi
          if [ "$tag_sha" != "$HEAD_SHA" ]; then
            commit_sha=$(gh api "repos/${{ github.repository }}/git/tags/${tag_sha}" --jq '.object.sha' 2>/dev/null || echo "$tag_sha")
            if [ "$commit_sha" != "$HEAD_SHA" ]; then
              echo "::error::Tag ${VERSION_TAG} (${commit_sha}) does not match build head_sha (${HEAD_SHA})"
              exit 1
            fi
          fi
          echo "Verified ${VERSION_TAG} is a tag pointing at ${HEAD_SHA}"

      - name: Download Dyad Launcher artifacts
        uses: dawidd6/action-download-artifact@b6e2e70617bc3265edd6dab6c906732b2f1ae151 # v21
        with:
          workflow: theseus-build.yml
          workflow_conclusion: success
          event: push
          branch: ${{ env.VERSION_TAG }}
          use_unzip: true

      - name: Extract app changelog
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ env.VERSION_TAG }}
        run: |
          LAST_GITHUB_RELEASE_PUBLISHED_AT=$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.published_at // ""' 2>/dev/null || true)
          LAST_GITHUB_RELEASE_PUBLISHED_AT="$LAST_GITHUB_RELEASE_PUBLISHED_AT" npx --yes tsx scripts/build-theseus-release-notes.ts

      # GitHub Release assets are served from a stable, predictable URL
      # (github.com/<repo>/releases/download/<tag>/<asset name>), but GitHub replaces runs of
      # whitespace in an uploaded asset's filename with a single "." when it stores the asset --
      # so an uploaded "Dyad Launcher_1.2.3_x64-setup.exe" is actually served back as
      # "Dyad.Launcher_1.2.3_x64-setup.exe". Rather than guess at that transform, copy every
      # bundle we're about to publish into a flat, space-free staging directory first, so the
      # name we upload is byte-for-byte the name we embed in the update manifest.
      - name: Stage release assets
        run: |
          set -euo pipefail
          VERSION="${VERSION_TAG#v}"
          mkdir -p release-assets

          cp "${MACOS_UNIVERSAL_BUNDLE_ARTIFACT_NAME}/universal-apple-darwin/release/bundle/macos/Dyad Launcher.app.tar.gz" \
            "release-assets/DyadLauncher_${VERSION}_universal.app.tar.gz"
          cp "${MACOS_UNIVERSAL_BUNDLE_ARTIFACT_NAME}/universal-apple-darwin/release/bundle/macos/Dyad Launcher.app.tar.gz.sig" \
            "release-assets/DyadLauncher_${VERSION}_universal.app.tar.gz.sig"
          cp "${MACOS_UNIVERSAL_BUNDLE_ARTIFACT_NAME}/universal-apple-darwin/release/bundle/dmg/Dyad Launcher_${VERSION}_universal.dmg" \
            "release-assets/DyadLauncher_${VERSION}_universal.dmg"

          cp "${LINUX_X64_BUNDLE_ARTIFACT_NAME}/release/bundle/appimage/Dyad Launcher_${VERSION}_amd64.AppImage" \
            "release-assets/DyadLauncher_${VERSION}_amd64.AppImage"
          cp "${LINUX_X64_BUNDLE_ARTIFACT_NAME}/release/bundle/appimage/Dyad Launcher_${VERSION}_amd64.AppImage.tar.gz" \
            "release-assets/DyadLauncher_${VERSION}_amd64.AppImage.tar.gz"
          cp "${LINUX_X64_BUNDLE_ARTIFACT_NAME}/release/bundle/appimage/Dyad Launcher_${VERSION}_amd64.AppImage.tar.gz.sig" \
            "release-assets/DyadLauncher_${VERSION}_amd64.AppImage.tar.gz.sig"
          cp "${LINUX_X64_BUNDLE_ARTIFACT_NAME}/release/bundle/deb/Dyad Launcher_${VERSION}_amd64.deb" \
            "release-assets/DyadLauncher_${VERSION}_amd64.deb"
          cp "${LINUX_X64_BUNDLE_ARTIFACT_NAME}/release/bundle/rpm/Dyad Launcher-${VERSION}-1.x86_64.rpm" \
            "release-assets/DyadLauncher-${VERSION}-1.x86_64.rpm"

          cp "${WINDOWS_X64_BUNDLE_ARTIFACT_NAME}/release/bundle/nsis/Dyad Launcher_${VERSION}_x64-setup.exe" \
            "release-assets/DyadLauncher_${VERSION}_x64-setup.exe"
          cp "${WINDOWS_X64_BUNDLE_ARTIFACT_NAME}/release/bundle/nsis/Dyad Launcher_${VERSION}_x64-setup.nsis.zip" \
            "release-assets/DyadLauncher_${VERSION}_x64-setup.nsis.zip"
          cp "${WINDOWS_X64_BUNDLE_ARTIFACT_NAME}/release/bundle/nsis/Dyad Launcher_${VERSION}_x64-setup.nsis.zip.sig" \
            "release-assets/DyadLauncher_${VERSION}_x64-setup.nsis.zip.sig"

          ls -la release-assets/

      - name: Generate version manifest
        env:
          RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION_TAG }}
        run: |
          # Reference: https://tauri.app/plugin/updater/#server-support
          jq -nc \
            --arg versionTag "${VERSION_TAG#v}" \
            --rawfile releaseNotes release-notes.md \
            --rawfile macOsUpdateArtifactSignature "release-assets/DyadLauncher_${VERSION_TAG#v}_universal.app.tar.gz.sig" \
            --rawfile linuxX64UpdateArtifactSignature "release-assets/DyadLauncher_${VERSION_TAG#v}_amd64.AppImage.tar.gz.sig" \
            --rawfile windowsX64UpdateArtifactSignature "release-assets/DyadLauncher_${VERSION_TAG#v}_x64-setup.nsis.zip.sig" \
          '{
            "version": $versionTag,
            "notes": $releaseNotes,
            "pub_date": now | todateiso8601,
            "platforms": {
              "darwin-aarch64": {
                "signature": $macOsUpdateArtifactSignature,
                "url": "${{ env.RELEASE_BASE_URL }}/DyadLauncher_\($versionTag)_universal.app.tar.gz",
                "install_urls": ["${{ env.RELEASE_BASE_URL }}/DyadLauncher_\($versionTag)_universal.dmg"]
              },
              "darwin-x86_64": {
                "signature": $macOsUpdateArtifactSignature,
                "url": "${{ env.RELEASE_BASE_URL }}/DyadLauncher_\($versionTag)_universal.app.tar.gz",
                "install_urls": ["${{ env.RELEASE_BASE_URL }}/DyadLauncher_\($versionTag)_universal.dmg"]
              },
              "linux-x86_64": {
                "signature": $linuxX64UpdateArtifactSignature,
                "url": "${{ env.RELEASE_BASE_URL }}/DyadLauncher_\($versionTag)_amd64.AppImage.tar.gz",
                "install_urls": [
                  "${{ env.RELEASE_BASE_URL }}/DyadLauncher_\($versionTag)_amd64.deb",
                  "${{ env.RELEASE_BASE_URL }}/DyadLauncher_\($versionTag)_amd64.AppImage",
                  "${{ env.RELEASE_BASE_URL }}/DyadLauncher-\($versionTag)-1.x86_64.rpm"
                ]
              },
              "windows-x86_64": {
                "signature": $windowsX64UpdateArtifactSignature,
                "url": "${{ env.RELEASE_BASE_URL }}/DyadLauncher_\($versionTag)_x64-setup.nsis.zip",
                "install_urls": ["${{ env.RELEASE_BASE_URL }}/DyadLauncher_\($versionTag)_x64-setup.exe"]
              }
            }
          }' > release-assets/updates.json

          echo "Generated manifest for version ${VERSION_TAG}:"
          cat release-assets/updates.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${VERSION_TAG#v}"

          gh release create "$VERSION_TAG" \
            --title "Dyad Launcher ${VERSION}" \
            --notes-file release-notes.md \
            release-assets/updates.json \
            "release-assets/DyadLauncher_${VERSION}_x64-setup.exe" \
            "release-assets/DyadLauncher_${VERSION}_universal.dmg" \
            "release-assets/DyadLauncher_${VERSION}_amd64.AppImage" \
            "release-assets/DyadLauncher_${VERSION}_amd64.deb" \
            "release-assets/DyadLauncher-${VERSION}-1.x86_64.rpm"

      # The updater feed configured in tauri-release.conf.json points at
      # .../releases/latest/download/updates.json, which GitHub always resolves to whichever
      # release is newest. That means publishing this release *is* going live for the updater --
      # there is no separate publish step.
