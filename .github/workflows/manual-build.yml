name: 'build'

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            name: 'macos-arm64'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            name: 'macos-x64'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            name: 'linux'
            args: ''
          - platform: 'windows-latest'
            name: 'windows'
            args: '--bundles nsis'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up app-lib env
        shell: bash
        run: cp packages/app-lib/.env.prod packages/app-lib/.env

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        shell: bash
        run: pnpm --filter=@modrinth/app run tauri build ${{ matrix.args }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.name }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/nsis/*setup.exe
            target/*/release/bundle/macos/*.app.tar.gz
            target/*/release/bundle/dmg/*.dmg
