name: Dyad Launcher build
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - .github/workflows/theseus-build.yml
      - 'apps/app/**'
      - 'apps/app-frontend/**'
      - 'packages/app-lib/**'
      - 'packages/app-macros/**'
      - 'packages/assets/**'
      - 'packages/ui/**'
      - 'packages/utils/**'
  workflow_dispatch:
    inputs:
      sign-windows-binaries:
        description: Sign Windows binaries
        type: boolean
        default: false
        required: false
      environment:
        description: Environment
        type: choice
        options:
          - prod
          - staging
          - prod-with-staging-archon
        default: prod
        required: false
      app-version-override:
        description: Temporary app version override for updater testing
        type: string
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/prod' }}

jobs:
  build:
    name: Build
    env:
      VITE_STRIPE_PUBLISHABLE_KEY: pk_live_51JbFxJJygY5LJFfKLVVldb10HlLt24p421OWRsTOWc5sXYFOnFUXWieSc6HD3PHo25ktx8db1WcHr36XGFvZFVUz00V9ixrCs5
      RUSTC_WRAPPER: 'sccache'
      # secrets can't be referenced directly in a step's `if:` (GitHub Actions rejects that at
      # parse time), so resolve it into a plain env var here instead.
      HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest, ubuntu-22.04]
        include:
          - platform: macos-latest
            artifact-target-name: universal-apple-darwin
          - platform: windows-latest
            artifact-target-name: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            artifact-target-name: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ''
          target: ${{ contains(matrix.artifact-target-name, 'darwin') && 'x86_64-apple-darwin' || '' }}

      - name: Setup mold
        if: contains(matrix.artifact-target-name, 'linux')
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1 / Mold 2.41.0

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Generate tauri-dev.conf.json
        shell: bash
        run: |
          GIT_HASH=$(git rev-parse --short HEAD)
          cat > apps/app/tauri-dev.conf.json <<EOF
          {
            "productName": "Dyad Launcher (dev-${GIT_HASH})",
            "mainBinaryName": "Dyad Launcher (dev-${GIT_HASH})",
            "identifier": "DyadLauncher-dev-${GIT_HASH}",
            "bundle": {
              "fileAssociations": []
            }
          }
          EOF

      - name: Install Linux build dependencies
        if: contains(matrix.artifact-target-name, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Dasel
        uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # v3.0.0
        with:
          repo: TomWright/dasel
          tag: v2.8.1
          extension-matching: disable
          rename-to: ${{ contains(matrix.artifact-target-name, 'windows') && 'dasel.exe' || 'dasel' }}
          chmod: 0755

      - name: Set application version and environment
        shell: bash
        run: |
          APP_VERSION="${{ inputs.app-version-override }}"
          if [ -z "$APP_VERSION" ]; then
            APP_VERSION="$(git describe --tags --always | sed -E 's/-([0-9]+)-(g[0-9a-fA-F]+)$/-canary+\1.\2/')"
          fi
          BUILD_ENVIRONMENT="${{ inputs.environment || 'prod' }}"
          echo "Setting application version to $APP_VERSION"
          echo "Using environment $BUILD_ENVIRONMENT"
          dasel put -f apps/app/Cargo.toml -t string -v "${APP_VERSION#v}" 'package.version'
          dasel put -f packages/app-lib/Cargo.toml -t string -v "${APP_VERSION#v}" 'package.version'
          dasel put -f apps/app-frontend/package.json -t string -v "${APP_VERSION#v}" 'version'

          cp "packages/app-lib/.env.${BUILD_ENVIRONMENT}" packages/app-lib/.env

      - name: Install dependencies
        run: pnpm install

      - name: Set up Windows code signing
        if: contains(matrix.artifact-target-name, 'windows')
        shell: bash
        run: |
          if [ '${{ (startsWith(github.ref, 'refs/tags/v') || inputs.sign-windows-binaries) && secrets.DIGICERT_ONE_SIGNER_API_KEY != '' }}' = 'true' ]; then
            choco install jsign --ignore-dependencies # GitHub runners come with a global Java installation already
          else
            # Signing was requested (or this is a tag build) but no DigiCert secrets are configured
            # in this repo (e.g. this fork) -- degrade to an unsigned build instead of hard-failing.
            dasel delete -f apps/app/tauri-release.conf.json 'bundle.windows.signCommand'
          fi

      - name: Build macOS app (signed)
        run: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || inputs.app-version-override != '') && 'pnpm --filter=@modrinth/app run tauri build --target universal-apple-darwin --config tauri-release.conf.json' || 'pnpm --filter=@modrinth/app run tauri build --target universal-apple-darwin --config tauri-dev.conf.json' }}
        if: contains(matrix.artifact-target-name, 'darwin') && env.HAS_APPLE_CERTIFICATE == 'true'
        env:
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
          ENABLE_CODE_SIGNING: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Build macOS app (unsigned)
        # No Apple code signing secrets are configured in this repo (e.g. this fork) --
        # degrade to an unsigned/ad-hoc-signed build instead of hard-failing on keychain import.
        # Setting APPLE_CERTIFICATE to an empty string (rather than omitting it) still makes
        # tauri-bundler attempt to import it into the keychain, which fails, so these Apple env
        # vars must be left completely unset here.
        run: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || inputs.app-version-override != '') && 'pnpm --filter=@modrinth/app run tauri build --target universal-apple-darwin --config tauri-release.conf.json' || 'pnpm --filter=@modrinth/app run tauri build --target universal-apple-darwin --config tauri-dev.conf.json' }}
        if: contains(matrix.artifact-target-name, 'darwin') && env.HAS_APPLE_CERTIFICATE == 'false'
        env:
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Build Linux app
        run: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || inputs.app-version-override != '') && 'pnpm --filter=@modrinth/app run tauri build --config tauri-release.conf.json' || 'pnpm --filter=@modrinth/app run tauri build --config tauri-dev.conf.json' }}
        if: contains(matrix.artifact-target-name, 'linux')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Build Windows app
        run: |
          [System.Convert]::FromBase64String("$env:DIGICERT_ONE_SIGNER_CLIENT_CERTIFICATE_BASE64") | Set-Content -Path signer-client-cert.p12 -AsByteStream
          $env:DIGICERT_ONE_SIGNER_CREDENTIALS = "$env:DIGICERT_ONE_SIGNER_API_KEY|$PWD\signer-client-cert.p12|$env:DIGICERT_ONE_SIGNER_CLIENT_CERTIFICATE_PASSWORD"
          $env:JAVA_HOME = "$env:JAVA_HOME_17_X64"
          ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || inputs.app-version-override != '') && 'pnpm --filter=@modrinth/app run tauri build --config tauri-release.conf.json --verbose --bundles "nsis"' || 'pnpm --filter=@modrinth/app run tauri build --config tauri-dev.conf.json --verbose --bundles "nsis"' }}
          Remove-Item -Path signer-client-cert.p12 -ErrorAction SilentlyContinue
        if: contains(matrix.artifact-target-name, 'windows')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          DIGICERT_ONE_SIGNER_API_KEY: ${{ secrets.DIGICERT_ONE_SIGNER_API_KEY }}
          DIGICERT_ONE_SIGNER_CLIENT_CERTIFICATE_BASE64: ${{ secrets.DIGICERT_ONE_SIGNER_CLIENT_CERTIFICATE_BASE64 }}
          DIGICERT_ONE_SIGNER_CLIENT_CERTIFICATE_PASSWORD: ${{ secrets.DIGICERT_ONE_SIGNER_CLIENT_CERTIFICATE_PASSWORD }}

      - name: Upload app bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: App bundle (${{ matrix.artifact-target-name }})
          path: |
            target/release/bundle/appimage/Dyad Launcher_*.AppImage*
            target/release/bundle/deb/Dyad Launcher_*.deb*
            target/release/bundle/rpm/Dyad Launcher-*.rpm*
            target/release/bundle/appimage/Dyad Launcher (dev-*)_*.AppImage*
            target/release/bundle/deb/Dyad Launcher (dev-*)_*.deb*
            target/release/bundle/rpm/Dyad Launcher (dev-*)-*.rpm*
            target/universal-apple-darwin/release/bundle/macos/Dyad Launcher.app.tar.gz*
            target/universal-apple-darwin/release/bundle/macos/Dyad Launcher (dev-*)*.app.tar.gz
            target/universal-apple-darwin/release/bundle/dmg/Dyad Launcher (dev-*)*.dmg
            target/universal-apple-darwin/release/bundle/dmg/Dyad Launcher_*.dmg*
            target/release/bundle/nsis/Dyad Launcher_*-setup.exe*
            target/release/bundle/nsis/Dyad Launcher (dev-*)_*-setup.exe*
            target/release/bundle/nsis/Dyad Launcher_*-setup.nsis.zip*

  release:
    name: Release Dyad Launcher
    needs: build
    # workflow_run can't be relied on to chain off a tag-triggered run (GitHub only fires it
    # reliably for branch-triggered runs), so the release job lives in the same workflow run as
    # the build it depends on instead of a separate workflow.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION_TAG: ${{ github.ref_name }}
      LINUX_X64_BUNDLE_ARTIFACT_NAME: App bundle (x86_64-unknown-linux-gnu)
      WINDOWS_X64_BUNDLE_ARTIFACT_NAME: App bundle (x86_64-pc-windows-msvc)
      MACOS_UNIVERSAL_BUNDLE_ARTIFACT_NAME: App bundle (universal-apple-darwin)

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Dyad Launcher artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0

      - name: Extract app changelog
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ env.VERSION_TAG }}
        run: |
          LAST_GITHUB_RELEASE_PUBLISHED_AT=$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.published_at // ""' 2>/dev/null || true)
          LAST_GITHUB_RELEASE_PUBLISHED_AT="$LAST_GITHUB_RELEASE_PUBLISHED_AT" npx --yes tsx scripts/build-theseus-release-notes.ts

      # GitHub Release assets are served from a stable, predictable URL
      # (github.com/<repo>/releases/download/<tag>/<asset name>), but GitHub replaces runs of
      # whitespace in an uploaded asset's filename with a single "." when it stores the asset --
      # so an uploaded "Dyad Launcher_1.2.3_x64-setup.exe" is actually served back as
      # "Dyad.Launcher_1.2.3_x64-setup.exe". Rather than guess at that transform, copy every
      # bundle we're about to publish into a flat, space-free staging directory first, so the
      # name we upload is byte-for-byte the name we embed in the update manifest.
      - name: Stage release assets
        run: |
          set -euo pipefail
          VERSION="${VERSION_TAG#v}"
          mkdir -p release-assets

          # upload-artifact's directory-stripping rule for wildcarded paths isn't predictable
          # enough to hardcode the resulting nested path (it depends on where the first wildcard
          # falls across every glob in that step's multiline `path:` list), so find each expected
          # file by name wherever it landed instead of assuming a fixed depth.
          stage() {
            local artifact_dir="$1" filename="$2" dest="$3" src
            src="$(find "$artifact_dir" -type f -name "$filename" -print -quit)"
            if [ -z "$src" ]; then
              echo "::error::Could not find '$filename' under '$artifact_dir'"
              find "$artifact_dir" -type f
              exit 1
            fi
            cp "$src" "release-assets/$dest"
          }

          stage "$MACOS_UNIVERSAL_BUNDLE_ARTIFACT_NAME" "Dyad Launcher.app.tar.gz" "DyadLauncher_${VERSION}_universal.app.tar.gz"
          stage "$MACOS_UNIVERSAL_BUNDLE_ARTIFACT_NAME" "Dyad Launcher.app.tar.gz.sig" "DyadLauncher_${VERSION}_universal.app.tar.gz.sig"
          stage "$MACOS_UNIVERSAL_BUNDLE_ARTIFACT_NAME" "Dyad Launcher_${VERSION}_universal.dmg" "DyadLauncher_${VERSION}_universal.dmg"

          stage "$LINUX_X64_BUNDLE_ARTIFACT_NAME" "Dyad Launcher_${VERSION}_amd64.AppImage" "DyadLauncher_${VERSION}_amd64.AppImage"
          stage "$LINUX_X64_BUNDLE_ARTIFACT_NAME" "Dyad Launcher_${VERSION}_amd64.AppImage.tar.gz" "DyadLauncher_${VERSION}_amd64.AppImage.tar.gz"
          stage "$LINUX_X64_BUNDLE_ARTIFACT_NAME" "Dyad Launcher_${VERSION}_amd64.AppImage.tar.gz.sig" "DyadLauncher_${VERSION}_amd64.AppImage.tar.gz.sig"
          stage "$LINUX_X64_BUNDLE_ARTIFACT_NAME" "Dyad Launcher_${VERSION}_amd64.deb" "DyadLauncher_${VERSION}_amd64.deb"
          stage "$LINUX_X64_BUNDLE_ARTIFACT_NAME" "Dyad Launcher-${VERSION}-1.x86_64.rpm" "DyadLauncher-${VERSION}-1.x86_64.rpm"

          stage "$WINDOWS_X64_BUNDLE_ARTIFACT_NAME" "Dyad Launcher_${VERSION}_x64-setup.exe" "DyadLauncher_${VERSION}_x64-setup.exe"
          stage "$WINDOWS_X64_BUNDLE_ARTIFACT_NAME" "Dyad Launcher_${VERSION}_x64-setup.nsis.zip" "DyadLauncher_${VERSION}_x64-setup.nsis.zip"
          stage "$WINDOWS_X64_BUNDLE_ARTIFACT_NAME" "Dyad Launcher_${VERSION}_x64-setup.nsis.zip.sig" "DyadLauncher_${VERSION}_x64-setup.nsis.zip.sig"

          ls -la release-assets/

      - name: Generate version manifest
        env:
          RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION_TAG }}
        run: |
          # Reference: https://tauri.app/plugin/updater/#server-support
          jq -nc \
            --arg versionTag "${VERSION_TAG#v}" \
            --rawfile releaseNotes release-notes.md \
            --rawfile macOsUpdateArtifactSignature "release-assets/DyadLauncher_${VERSION_TAG#v}_universal.app.tar.gz.sig" \
            --rawfile linuxX64UpdateArtifactSignature "release-assets/DyadLauncher_${VERSION_TAG#v}_amd64.AppImage.tar.gz.sig" \
            --rawfile windowsX64UpdateArtifactSignature "release-assets/DyadLauncher_${VERSION_TAG#v}_x64-setup.nsis.zip.sig" \
          '{
            "version": $versionTag,
            "notes": $releaseNotes,
            "pub_date": now | todateiso8601,
            "platforms": {
              "darwin-aarch64": {
                "signature": $macOsUpdateArtifactSignature,
                "url": "${{ env.RELEASE_BASE_URL }}/DyadLauncher_\($versionTag)_universal.app.tar.gz",
                "install_urls": ["${{ env.RELEASE_BASE_URL }}/DyadLauncher_\($versionTag)_universal.dmg"]
              },
              "darwin-x86_64": {
                "signature": $macOsUpdateArtifactSignature,
                "url": "${{ env.RELEASE_BASE_URL }}/DyadLauncher_\($versionTag)_universal.app.tar.gz",
                "install_urls": ["${{ env.RELEASE_BASE_URL }}/DyadLauncher_\($versionTag)_universal.dmg"]
              },
              "linux-x86_64": {
                "signature": $linuxX64UpdateArtifactSignature,
                "url": "${{ env.RELEASE_BASE_URL }}/DyadLauncher_\($versionTag)_amd64.AppImage.tar.gz",
                "install_urls": [
                  "${{ env.RELEASE_BASE_URL }}/DyadLauncher_\($versionTag)_amd64.deb",
                  "${{ env.RELEASE_BASE_URL }}/DyadLauncher_\($versionTag)_amd64.AppImage",
                  "${{ env.RELEASE_BASE_URL }}/DyadLauncher-\($versionTag)-1.x86_64.rpm"
                ]
              },
              "windows-x86_64": {
                "signature": $windowsX64UpdateArtifactSignature,
                "url": "${{ env.RELEASE_BASE_URL }}/DyadLauncher_\($versionTag)_x64-setup.nsis.zip",
                "install_urls": ["${{ env.RELEASE_BASE_URL }}/DyadLauncher_\($versionTag)_x64-setup.exe"]
              }
            }
          }' > release-assets/updates.json

          echo "Generated manifest for version ${VERSION_TAG}:"
          cat release-assets/updates.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${VERSION_TAG#v}"

          gh release create "$VERSION_TAG" \
            --title "Dyad Launcher ${VERSION}" \
            --notes-file release-notes.md \
            release-assets/updates.json \
            "release-assets/DyadLauncher_${VERSION}_x64-setup.exe" \
            "release-assets/DyadLauncher_${VERSION}_x64-setup.nsis.zip" \
            "release-assets/DyadLauncher_${VERSION}_x64-setup.nsis.zip.sig" \
            "release-assets/DyadLauncher_${VERSION}_universal.dmg" \
            "release-assets/DyadLauncher_${VERSION}_universal.app.tar.gz" \
            "release-assets/DyadLauncher_${VERSION}_universal.app.tar.gz.sig" \
            "release-assets/DyadLauncher_${VERSION}_amd64.AppImage" \
            "release-assets/DyadLauncher_${VERSION}_amd64.AppImage.tar.gz" \
            "release-assets/DyadLauncher_${VERSION}_amd64.AppImage.tar.gz.sig" \
            "release-assets/DyadLauncher_${VERSION}_amd64.deb" \
            "release-assets/DyadLauncher-${VERSION}-1.x86_64.rpm"

      # The updater feed configured in tauri-release.conf.json points at
      # .../releases/latest/download/updates.json, which GitHub always resolves to whichever
      # release is newest. That means publishing this release *is* going live for the updater --
      # there is no separate publish step.
